name: Publier les modèles FORGEIA
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, publish, assets, audit]
        required: true
      pack:
        type: choice
        options: [crafto, canvas]
        default: crafto
        required: false
      release:
        required: true
      source_release:
        required: false
      sha256:
        required: true
      bytes:
        required: false
      public_key:
        required: false
      preview_url:
        required: false
permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ inputs.mode == 'audit' && 'publish-examples-audit' || 'publish-examples' }}
  cancel-in-progress: false
env:
  AWS_REGION: eu-west-3
  RELEASE: ${{ inputs.release }}
  SOURCE_RELEASE: ${{ inputs.source_release }}
  SOURCE_PACK: ${{ inputs.pack || 'crafto' }}
  SHA256: ${{ inputs.sha256 }}
  BUNDLE_BYTES: ${{ inputs.bytes }}
  UPLOAD_PUBLIC_KEY: ${{ inputs.public_key }}
  PREVIEW_URL: ${{ inputs.preview_url }}
jobs:
  audit:
    if: inputs.mode == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
      - name: Vérifier le catalogue et les archives sur AWS
        run: node scripts/crafto/cloud.mjs audit
  publish:
    if: inputs.mode != 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
      - name: Préparer un envoi privé
        if: inputs.mode == 'prepare'
        run: node scripts/crafto/cloud.mjs prepare
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'prepare'
        with:
          name: crafto-upload-target
          path: upload-target.encrypted.json
          retention-days: 1
      - name: Récupérer le pack vérifié
        if: inputs.mode != 'prepare'
        run: node scripts/crafto/cloud.mjs fetch
      - uses: actions/setup-python@v5
        if: inputs.mode != 'prepare'
        with:
          python-version: '3.12'
      - name: Importer les sources statiques
        if: inputs.mode != 'prepare'
        run: |
          python scripts/crafto/test_package.py
          python scripts/crafto/test_brand.py
          python scripts/crafto/test_canvas.py
          node --test scripts/crafto/catalog-merge.test.mjs
      - name: Préparer la première collection
        if: inputs.mode != 'prepare' && inputs.pack != 'canvas'
        run: |
          python scripts/crafto/extract.py crafto.zip crafto-original crafto-build
          python scripts/crafto/brand.py crafto-build/html --pack crafto --catalog crafto-build/catalog.json --base-url "${PREVIEW_URL}/${RELEASE}"
      - name: Préparer la nouvelle collection
        if: inputs.mode != 'prepare' && inputs.pack == 'canvas'
        run: |
          python scripts/crafto/canvas.py extract crafto.zip canvas-original
          python scripts/crafto/canvas.py prepare canvas-original crafto-build --consume-extracted --preview-url "${PREVIEW_URL}/${RELEASE}"
      - name: Générer et vérifier les captures de chaque page
        if: inputs.mode == 'publish'
        env:
          CRAFTO_NODE_MODULES: ${{ github.workspace }}/node_modules
          CRAFTO_BROWSER: /usr/bin/google-chrome
        run: |
          npm install --no-save --package-lock=false playwright sharp --no-audit --no-fund
          node scripts/crafto/capture.mjs crafto-build
      - name: Préparer les archives étudiantes
        if: inputs.mode == 'publish' && inputs.pack != 'canvas'
        run: python scripts/crafto/package.py archives crafto-build crafto-archives --preview-url "${PREVIEW_URL}/${RELEASE}"
      - name: Préparer les archives de la nouvelle collection
        if: inputs.mode == 'publish' && inputs.pack == 'canvas'
        run: node scripts/crafto/cloud.mjs archives
      - name: Publier les aperçus et activer le catalogue complet
        if: inputs.mode == 'publish'
        run: node scripts/crafto/cloud.mjs publish
      - name: Compléter uniquement les fichiers statiques
        if: inputs.mode == 'assets'
        run: node scripts/crafto/cloud.mjs assets
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'publish'
        with:
          name: crafto-preview-review
          retention-days: 2
          path: |
            crafto-build/capture-report.json
            crafto-build/thumbnails/demo-accounting-services.jpg
            crafto-build/thumbnails/demo-accounting.jpg
            crafto-build/thumbnails/demo-photography.jpg
            crafto-build/thumbnails/demo-restaurant-menu.jpg
            crafto-build/thumbnails/demo-digital-agency-rtl.jpg
            crafto-build/thumbnails/element-accordion.jpg
            crafto-build/thumbnails/index.jpg
            crafto-build/repair-report.json
            crafto-build/catalog.json
            crafto-build/archive-index.json
            crafto-build/thumbnails/f2-demo-construction.jpg
            crafto-build/thumbnails/f2-demo-magazine.jpg
            crafto-build/thumbnails/f2-index.jpg
