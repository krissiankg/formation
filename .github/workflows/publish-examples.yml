name: Publier les exemples Crafto
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, publish, assets]
        required: true
      release:
        required: true
      sha256:
        required: true
      bytes:
        required: false
      public_key:
        required: false
      preview_url:
        required: false
permissions:
  id-token: write
  contents: read
concurrency:
  group: publish-examples
  cancel-in-progress: false
env:
  AWS_REGION: eu-west-3
  RELEASE: ${{ inputs.release }}
  SHA256: ${{ inputs.sha256 }}
  BUNDLE_BYTES: ${{ inputs.bytes }}
  UPLOAD_PUBLIC_KEY: ${{ inputs.public_key }}
  PREVIEW_URL: ${{ inputs.preview_url }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
      - name: Préparer un envoi privé
        if: inputs.mode == 'prepare'
        run: node scripts/crafto/cloud.mjs prepare
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'prepare'
        with:
          name: crafto-upload-target
          path: upload-target.encrypted.json
          retention-days: 1
      - name: Récupérer le pack vérifié
        if: inputs.mode != 'prepare'
        run: node scripts/crafto/cloud.mjs fetch
      - uses: actions/setup-python@v5
        if: inputs.mode != 'prepare'
        with:
          python-version: '3.12'
      - name: Importer les sources statiques
        if: inputs.mode != 'prepare'
        run: |
          python scripts/crafto/test_package.py
          python scripts/crafto/extract.py crafto.zip crafto-original crafto-build
      - name: Préparer les archives étudiantes
        if: inputs.mode == 'publish'
        run: |
          python scripts/crafto/package.py archives crafto-build crafto-archives --preview-url "${PREVIEW_URL}/${RELEASE}"
      - name: Générer et vérifier les captures de chaque page
        if: inputs.mode == 'publish'
        env:
          CRAFTO_NODE_MODULES: ${{ github.workspace }}/node_modules
          CRAFTO_BROWSER: /usr/bin/google-chrome
        run: |
          npm install --no-save --package-lock=false playwright sharp --no-audit --no-fund
          node scripts/crafto/capture.mjs crafto-build
      - name: Publier les aperçus et activer le catalogue complet
        if: inputs.mode == 'publish'
        run: node scripts/crafto/cloud.mjs publish
      - name: Compléter uniquement les fichiers statiques
        if: inputs.mode == 'assets'
        run: node scripts/crafto/cloud.mjs assets
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'publish'
        with:
          name: crafto-preview-review
          retention-days: 2
          path: |
            crafto-build/capture-report.json
            crafto-build/thumbnails/demo-accounting-services.jpg
            crafto-build/thumbnails/demo-restaurant-menu.jpg
            crafto-build/thumbnails/demo-digital-agency-rtl.jpg
            crafto-build/thumbnails/element-accordion.jpg
