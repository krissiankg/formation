#PROXY-START/
# Page de connexion + auth PHP (voir supabase.guelichweb.store.conf)

location / {
    auth_request /internal/auth-verify;
    error_page 401 = @supabase_login;

    proxy_set_header Authorization $supabase_kong_auth;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_read_timeout 86400;
}

location @supabase_login {
    return 302 /login/?next=$request_uri;
}

location = /internal/auth-verify {
    internal;
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME /www/wwwroot/supabase.guelichweb.store/auth/verify.php;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
}
#PROXY-END/
