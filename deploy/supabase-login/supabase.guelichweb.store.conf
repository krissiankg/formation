server
{
    listen 80;
    listen 443 ssl http2;
    server_name supabase.guelichweb.store;
    root /www/wwwroot/supabase.guelichweb.store;

    if ($server_port !~ 443) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    ssl_certificate /etc/letsencrypt/live/supabase.guelichweb.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.guelichweb.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /www/wwwroot/supabase.guelichweb.store;
    }

    location ^~ /email-templates/ {
        default_type "text/html";
        alias /www/wwwroot/supabase.guelichweb.store/email-templates/;
    }

    include /www/server/panel/vhost/nginx/extension/supabase.guelichweb.store/auth-header.conf;

    location ^~ /login/ {
        try_files $uri $uri/ /login/index.html;
    }

    location = /login {
        return 302 /login/;
    }

    location ~ ^/auth/.+\.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        include pathinfo.conf;
    }

    include /www/server/panel/vhost/nginx/proxy/supabase.guelichweb.store/*.conf;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    access_log /www/wwwlogs/supabase.guelichweb.store.log;
    error_log /www/wwwlogs/supabase.guelichweb.store.error.log;
}
